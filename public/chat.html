<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat – Perfections Recruitment</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: #e5ddd5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .whatsapp-container {
      width: 100%;
      max-width: 450px;
      height: 100vh;
      background: white;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    
    /* Header */
    .chat-header {
      background: #075e54;
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .header-avatar {
      width: 40px;
      height: 40px;
      background: #128C7E;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .header-info {
      flex: 1;
    }
    .header-info h2 {
      font-size: 18px;
      margin-bottom: 3px;
    }
    .header-info p {
      font-size: 12px;
      opacity: 0.8;
    }
    .header-icons {
      display: flex;
      gap: 20px;
    }
    .header-icons i {
      font-size: 20px;
      cursor: pointer;
    }
    
    /* Login Screen */
    .login-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      background: #f0f2f5;
    }
    .whatsapp-logo {
      width: 80px;
      height: 80px;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: white;
      margin-bottom: 30px;
    }
    .login-title {
      font-size: 24px;
      color: #075e54;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .login-subtitle {
      color: #667781;
      text-align: center;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .login-input {
      width: 100%;
      padding: 15px;
      border: 1px solid #e0e0e0;
      border-radius: 30px;
      font-size: 16px;
      margin-bottom: 15px;
      outline: none;
    }
    .login-input:focus {
      border-color: #25D366;
    }
    .login-btn {
      background: #25D366;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      transition: 0.2s;
    }
    .login-btn:hover {
      background: #128C7E;
    }
    .login-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .login-footer {
      margin-top: 20px;
      font-size: 12px;
      color: #667781;
    }
    .login-footer a {
      color: #25D366;
      text-decoration: none;
    }
    
    /* Messages Area */
    .messages-area {
      flex: 1;
      background: #e5ddd5;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23e5ddd5" opacity="0.1"/><circle cx="20" cy="20" r="10" fill="%23ffffff" opacity="0.1"/><circle cx="80" cy="80" r="15" fill="%23ffffff" opacity="0.1"/></svg>');
      overflow-y: auto;
      padding: 15px;
      display: none;
      flex-direction: column;
    }
    
    .messages-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .message {
      display: flex;
      max-width: 80%;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .message.user {
      align-self: flex-end;
    }
    .message.admin {
      align-self: flex-start;
    }
    
    .message-content {
      padding: 10px 15px;
      border-radius: 7.5px;
      position: relative;
      word-wrap: break-word;
      font-size: 14px;
      line-height: 1.4;
    }
    
    .message.user .message-content {
      background: #dcf8c6;
      border-top-right-radius: 0;
    }
    .message.user .message-content::after {
      content: '';
      position: absolute;
      top: 0;
      right: -10px;
      width: 0;
      height: 0;
      border-left: 10px solid #dcf8c6;
      border-top: 10px solid transparent;
    }
    
    .message.admin .message-content {
      background: white;
      border-top-left-radius: 0;
    }
    .message.admin .message-content::after {
      content: '';
      position: absolute;
      top: 0;
      left: -10px;
      width: 0;
      height: 0;
      border-right: 10px solid white;
      border-top: 10px solid transparent;
    }
    
    .message-time {
      font-size: 10px;
      color: #667781;
      margin-top: 5px;
      text-align: right;
    }
    .message.user .message-time {
      color: #4b5b6b;
    }
    
    .message-status {
      font-size: 12px;
      color: #34b7f1;
      margin-left: 5px;
    }
    
    .date-divider {
      text-align: center;
      margin: 15px 0;
    }
    .date-divider span {
      background: rgba(225,245,254,0.92);
      padding: 5px 12px;
      border-radius: 7.5px;
      font-size: 11px;
      color: #667781;
    }
    
    /* Input Area */
    .input-area {
      background: #f0f2f5;
      padding: 10px;
      display: none;
      align-items: center;
      gap: 10px;
    }
    .input-area input {
      flex: 1;
      padding: 12px 15px;
      border: none;
      border-radius: 25px;
      outline: none;
      font-size: 14px;
    }
    .input-area button {
      background: #25D366;
      color: white;
      border: none;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: 0.2s;
    }
    .input-area button:hover {
      background: #128C7E;
    }
    .input-area button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 10px 15px;
      background: white;
      border-radius: 7.5px;
      border-top-left-radius: 0;
      width: fit-content;
    }
    .typing-indicator span {
      width: 8px;
      height: 8px;
      background: #909090;
      border-radius: 50%;
      animation: typing 1.4s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); background: #909090; }
      30% { transform: translateY(-10px); background: #25D366; }
    }
    
    /* Connection status */
    .connection-status {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 5px;
      z-index: 1000;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot.connected { background: #25D366; }
    .dot.disconnected { background: #ff4444; }
    
    /* Loading */
    .loading-spinner {
      text-align: center;
      padding: 30px;
      color: #075e54;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #f0f2f5;
      border-top: 3px solid #25D366;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    @media (max-width: 450px) {
      .whatsapp-container {
        height: 100vh;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="whatsapp-container">
    <!-- Header -->
    <div class="chat-header">
      <div class="header-avatar">
        <i class="fas fa-building"></i>
      </div>
      <div class="header-info">
        <h2>Perfections Recruitment</h2>
        <p id="statusText">Connect with our team</p>
      </div>
      <div class="header-icons">
        <i class="fas fa-phone-alt"></i>
        <i class="fas fa-video"></i>
        <i class="fas fa-ellipsis-v"></i>
      </div>
    </div>
    
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
      <div class="whatsapp-logo">
        <i class="fab fa-whatsapp"></i>
      </div>
      <h2 class="login-title">Chat with us</h2>
      <p class="login-subtitle">Enter your email to start chatting with our recruitment team</p>
      <input type="email" id="emailInput" class="login-input" placeholder="your.email@example.com" required>
      <button id="loginBtn" class="login-btn" onclick="handleLogin()">
        <i class="fab fa-whatsapp"></i> Start Chat
      </button>
      <div class="login-footer">
        <p>By continuing, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a></p>
        <p style="margin-top: 10px;">Also available on <i class="fab fa-telegram"></i> Telegram</p>
      </div>
    </div>
    
    <!-- Messages Area -->
    <div id="messagesArea" class="messages-area">
      <div id="messagesContainer" class="messages-container"></div>
      <div id="typingIndicator" class="typing-indicator" style="display: none;">
        <span></span><span></span><span></span>
      </div>
    </div>
    
    <!-- Input Area -->
    <div id="inputArea" class="input-area">
      <input type="text" id="messageInput" placeholder="Type a message" disabled>
      <button id="sendBtn" disabled onclick="sendMessage()">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </div>
  
  <!-- Connection Status -->
  <div id="connectionStatus" class="connection-status">
    <span class="dot disconnected" id="statusDot"></span>
    <span id="statusText2">Connecting...</span>
  </div>
  
  <script>
    let ws;
    let userId = localStorage.getItem('chatUserId');
    let userEmail = localStorage.getItem('chatEmail');
    let userName = localStorage.getItem('chatUserName');
    let reconnectAttempts = 0;
    
    const loginScreen = document.getElementById('loginScreen');
    const messagesArea = document.getElementById('messagesArea');
    const inputArea = document.getElementById('inputArea');
    const messagesContainer = document.getElementById('messagesContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText2 = document.getElementById('statusText2');
    
    // Check if user is already logged in
    if (userId && userEmail) {
      loginScreen.style.display = 'none';
      messagesArea.style.display = 'flex';
      inputArea.style.display = 'flex';
      connectWebSocket();
      loadChatHistory();
    }
    
    // Handle login
    async function handleLogin() {
      const email = document.getElementById('emailInput').value.trim();
      if (!email || !email.includes('@') || !email.includes('.')) {
        alert('Please enter a valid email address');
        return;
      }
      
      document.getElementById('loginBtn').disabled = true;
      document.getElementById('loginBtn').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking...';
      
      try {
        // Check if user exists
        const checkResponse = await fetch('/api/user/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        
        const checkData = await checkResponse.json();
        
        if (checkData.exists) {
          userId = checkData.userId;
          userName = checkData.userName;
        } else {
          // Create new user
          const createResponse = await fetch('/api/user/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              email, 
              userName: email.split('@')[0] 
            })
          });
          
          const createData = await createResponse.json();
          userId = createData.userId;
          userName = createData.userName;
        }
        
        // Store in localStorage
        localStorage.setItem('chatUserId', userId);
        localStorage.setItem('chatEmail', email);
        localStorage.setItem('chatUserName', userName);
        userEmail = email;
        
        // Show chat interface
        loginScreen.style.display = 'none';
        messagesArea.style.display = 'flex';
        inputArea.style.display = 'flex';
        
        connectWebSocket();
        loadChatHistory();
        
      } catch (error) {
        console.error('Login error:', error);
        alert('Failed to login. Please try again.');
      } finally {
        document.getElementById('loginBtn').disabled = false;
        document.getElementById('loginBtn').innerHTML = '<i class="fab fa-whatsapp"></i> Start Chat';
      }
    }
    
    // Connect WebSocket
    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}`;
      
      ws = new WebSocket(wsUrl);
      
      ws.onopen = () => {
        console.log('Connected to server');
        statusDot.className = 'dot connected';
        statusText2.textContent = 'Connected';
        messageInput.disabled = false;
        sendBtn.disabled = false;
        
        // Register user
        ws.send(JSON.stringify({
          type: 'register',
          userId: userId,
          userName: userName,
          email: userEmail
        }));
      };
      
      ws.onclose = () => {
        console.log('Disconnected from server');
        statusDot.className = 'dot disconnected';
        statusText2.textContent = 'Disconnected';
        messageInput.disabled = true;
        sendBtn.disabled = true;
        
        // Try to reconnect
        setTimeout(connectWebSocket, 3000);
      };
      
      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        
        if (data.type === 'history') {
          displayMessages(data.messages);
        }
        
        if (data.type === 'new_message') {
          addMessage(data.message);
          scrollToBottom();
        }
        
        if (data.type === 'admin_reply') {
          addMessage({
            message: data.message,
            userName: 'Admin',
            isAdmin: true,
            timestamp: new Date().toISOString()
          });
          scrollToBottom();
        }
      };
    }
    
    // Load chat history
    async function loadChatHistory() {
      try {
        const response = await fetch(`/api/user/${userId}/messages`);
        const messages = await response.json();
        displayMessages(messages);
      } catch (error) {
        console.error('Failed to load history:', error);
      }
    }
    
    // Display messages
    function displayMessages(messages) {
      messagesContainer.innerHTML = '';
      
      if (messages.length === 0) {
        // Welcome message
        messagesContainer.innerHTML = `
          <div class="message admin">
            <div class="message-content">
              👋 Welcome to Perfections Recruitment! How can we help you today?
              <div class="message-time">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
            </div>
          </div>
        `;
        return;
      }
      
      messages.forEach(addMessage);
      scrollToBottom();
    }
    
    // Add single message
    function addMessage(msg) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${msg.isAdmin ? 'admin' : 'user'}`;
      
      const time = new Date(msg.timestamp).toLocaleTimeString([], { 
        hour: '2-digit', 
        minute: '2-digit' 
      });
      
      messageDiv.innerHTML = `
        <div class="message-content">
          ${escapeHtml(msg.message)}
          <div class="message-time">
            ${time}
            ${!msg.isAdmin ? '<span class="message-status"><i class="fas fa-check-double"></i></span>' : ''}
          </div>
        </div>
      `;
      
      messagesContainer.appendChild(messageDiv);
    }
    
    // Send message
    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;
      
      const message = {
        type: 'chat',
        userId: userId,
        userName: userName,
        text: text
      };
      
      ws.send(JSON.stringify(message));
      
      // Add message to UI immediately
      addMessage({
        message: text,
        userName: userName,
        isAdmin: false,
        timestamp: new Date().toISOString()
      });
      
      messageInput.value = '';
      scrollToBottom();
    }
    
    // Scroll to bottom
    function scrollToBottom() {
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }
    
    // Enter key
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
    
    // Escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
